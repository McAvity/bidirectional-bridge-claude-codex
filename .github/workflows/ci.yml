name: Build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      # Real CLI identity/version checks only; no login, model calls or API credentials.
      - run: npm install --global --ignore-scripts @openai/codex@0.155.1
      - run: npm run build
      - run: npm run packages:check
      - run: node docs/tools/check-doc-links.mjs
      - name: Diagnose runner process visibility
        run: node scripts/setup/ci-process-access.mjs
      # Setup must refuse unreadable same-user processes. The hosted runner service
      # can hold protected descriptors; tests get their own unprivileged user so
      # the service is outside their observation scope, without weakening the guard.
      - name: Prepare isolated test user
        run: |
          sudo useradd --create-home --shell /bin/bash bridge-test
          sudo chown -R bridge-test:bridge-test "$GITHUB_WORKSPACE"
      - name: Verify isolated process visibility
        run: sudo -H -u bridge-test env PATH="$PATH" CI=true node scripts/setup/ci-process-access.mjs --require-readable
      - name: JavaScript tests (isolated user)
        run: sudo -H -u bridge-test env PATH="$PATH" CI=true npm test
      - name: Python tests (isolated user)
        run: sudo -H -u bridge-test env PATH="$PATH" CI=true python3 -m unittest discover -s tests -v
      # Pilot tools: synthetic regressions and the tooling dry run (scripted executor, no model).
      - name: Pilot tooling tests (isolated user)
        run: sudo -H -u bridge-test env PATH="$PATH" CI=true python3 -m unittest discover -s tools/pilot/tests -v
      - name: Restore checkout ownership
        if: always()
        run: sudo chown -R "$(id -un):$(id -gn)" "$GITHUB_WORKSPACE"
