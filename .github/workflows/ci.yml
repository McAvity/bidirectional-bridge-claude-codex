name: Build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      # Real CLI identity/version checks only; no login, model calls or API credentials.
      - run: npm install --global --ignore-scripts @openai/codex@0.155.1
      - run: npm run build
      - run: npm run packages:check
      - run: node docs/tools/check-doc-links.mjs
      - run: npm test
      - run: python3 -m unittest discover -s tests -v
      # Pilot tools: synthetic regressions and the tooling dry run (scripted executor, no model).
      - run: python3 -m unittest discover -s tools/pilot/tests -v
