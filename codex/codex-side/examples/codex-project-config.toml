# Copy this table into <external-project>/.codex/config.toml after linking the
# Bridge checkout with `npm link`. No Bridge source path belongs in this file.

[mcp_servers.bridge]
command = "claude-codex-bridge"
args = [
  "--caller", "codex",
  "--delegation", "allow",
  "--workspace", "."
]
cwd = "."
required = true
startup_timeout_sec = 30
# How long this client waits for one MCP call. It does not bound the worker; keep it above
# the longest round deadline plus a margin (5400 s carries a 75-minute round).
tool_timeout_sec = 5400
